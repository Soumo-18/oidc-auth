<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --border: #e4e4e7;
      --input-bg: #ffffff;
      --ring: #18181b;
      --card-bg: #ffffff;
      --card-shadow: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
      --radius: 0.5rem;
      --btn-bg: #18181b;
      --btn-fg: #fafafa;
      --btn-hover: #27272a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --input-bg: #09090b;
        --ring: #d4d4d8;
        --card-bg: #18181b;
        --card-shadow: 0 1px 3px 0 rgb(0 0 0 / .4), 0 1px 2px -1px rgb(0 0 0 / .4);
        --btn-bg: #fafafa;
        --btn-fg: #18181b;
        --btn-hover: #e4e4e7;
      }
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--card-shadow);
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .icon {
      width: 40px;
      height: 40px;
      background: var(--fg);
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    .form { display: flex; flex-direction: column; gap: 1rem; }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg);
    }

    input {
      width: 100%;
      height: 2.375rem;
      padding: 0 0.75rem;
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--fg);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input::placeholder { color: var(--muted); }

    input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 20%, transparent);
    }

    input[readonly] {
      background: color-mix(in srgb, var(--bg) 50%, var(--border));
      color: var(--muted);
      cursor: text;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
    }

    button {
      width: 100%;
      height: 2.375rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--btn-fg);
      background: var(--btn-bg);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 0.25rem;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover { background: var(--btn-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid color-mix(in srgb, var(--btn-fg) 30%, transparent);
      border-top-color: var(--btn-fg);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      display: none;
      font-size: 0.8125rem;
      color: #ef4444;
      background: color-mix(in srgb, #ef4444 10%, transparent);
      border: 1px solid color-mix(in srgb, #ef4444 25%, transparent);
      border-radius: var(--radius);
      padding: 0.625rem 0.75rem;
    }

    .success-container {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .warning-box {
      font-size: 0.8125rem;
      color: #ca8a04;
      background: color-mix(in srgb, #eab308 10%, transparent);
      border: 1px solid color-mix(in srgb, #eab308 25%, transparent);
      border-radius: var(--radius);
      padding: 0.875rem;
      line-height: 1.5;
    }

  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--bg)">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </div>
      <h1>Developer Portal</h1>
      <p class="subtitle" id="formSubtitle">Register your application to get API keys</p>
    </div>

    <form class="form" id="registerForm" novalidate>
      <div id="errorMsg" class="error-msg" role="alert"></div>

      <div class="field">
        <label for="appName">Application Name</label>
        <input id="appName" name="appName" type="text" placeholder="e.g. My React Dashboard" required />
      </div>

      <div class="field">
        <label for="appUrl">Homepage URL (Optional)</label>
        <input id="appUrl" name="appUrl" type="url" placeholder="http://localhost:3000" />
      </div>

      <div class="field">
        <label for="redirectUri">Redirect URI</label>
        <input id="redirectUri" name="redirectUri" type="url" placeholder="http://localhost:3000/callback" required />
        <span class="hint">Where we should redirect users after they log in.</span>
      </div>

      <button type="submit" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Register Application</span>
      </button>
    </form>

    <div class="success-container" id="successContainer">
      <div class="warning-box">
        <strong>Important:</strong> Copy your Client Secret now. You will not be able to see it again!
      </div>

      <div class="field">
        <label>Client ID</label>
        <input id="outClientId" type="text" readonly onclick="this.select()" />
      </div>

      <div class="field">
        <label>Client Secret</label>
        <input id="outClientSecret" type="text" readonly onclick="this.select()" />
      </div>

      <button type="button" onclick="window.location.reload()" style="background: var(--bg); color: var(--fg); border: 1px solid var(--border);">
        Register Another App
      </button>
    </div>

  </div>

  <script>
    const form = document.getElementById('registerForm');
    const successContainer = document.getElementById('successContainer');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const formSubtitle = document.getElementById('formSubtitle');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      spinner.style.display = loading ? 'block' : 'none';
      btnText.textContent = loading ? 'Registering...' : 'Register Application';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const name = document.getElementById('appName').value.trim();
      const url = document.getElementById('appUrl').value.trim();
      const redirectUri = document.getElementById('redirectUri').value.trim();

      if (!name || !redirectUri) {
        showError('Application Name and Redirect URI are required.');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch('/admin/register-app', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, url, redirectUri }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showError(data.message || 'Something went wrong. Please try again.');
        } else {
          // Success! Hide form, show credentials
          form.style.display = 'none';
          formSubtitle.textContent = 'Application registered successfully.';
          successContainer.style.display = 'flex';
          
          document.getElementById('outClientId').value = data.client_id;
          document.getElementById('outClientSecret').value = data.client_secret;
        }
      } catch {
        showError('Failed to connect to the server.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
